name: CI

on:
  pull_request:
    branches: [main, develop]

jobs:
  chaos-planning-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify safety admission and planning gates
        run: python -m unittest discover -s tests -v
      - name: Verify planning preview
        run: python -m chaos.planner

  lint-and-typecheck:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-service, product-service, order-service, notification-service, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm ci

      - name: Type check
        working-directory: ${{ matrix.service }}
        run: npx tsc --noEmit
